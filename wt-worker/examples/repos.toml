# Copy this file to ~/.config/wt-worker/repos.toml to enable per-repo
# GitHub App authentication for workers.
#
# When `wt-worker spawn` runs, it:
#   1. Reads the current repo's `origin` remote (e.g. github.com/td72/foo)
#   2. Looks up the matching entry below — repo-level wins, org-level is the
#      fallback (shallow-merged per top-level key)
#   3. Fetches the referenced 1Password item to get the App's
#      app_id / installation_id / private_key
#   4. Generates a JWT and mints an installation token, scoped to:
#        - repositories: [<current-repo-name>]
#        - permissions:  <permissions block below>
#   5. Stores the token as the sandbox's per-sandbox `github` secret
#      (overrides the global one if any). Token expires in 1 hour.
#
# Prerequisites:
#   - `op` CLI (1Password) authenticated to the vault(s) referenced below
#   - `uv` (for wt-worker-gh-token's inline-deps shebang)
#   - A GitHub App created at https://github.com/settings/apps with the App's
#     private key, App ID, and the install's installation_id stored in a
#     1Password item as fields named: app_id, installation_id, private_key
#
# Org/user keys use the form "<host>/<owner>". Repo keys add "/<repo>".

# ─── org-level defaults (most repos in this org/user reuse this) ───
["github.com/td72"]
op_item     = "op://Personal/td72-wt-worker"
permissions = { contents = "write", pull_requests = "write" }

# ─── repo-level overrides (only write keys that differ from the org entry) ───
# Example: read-only worker for a repo that should never be pushed to.
["github.com/td72/secret-stuff"]
permissions = { contents = "read", pull_requests = "write" }
